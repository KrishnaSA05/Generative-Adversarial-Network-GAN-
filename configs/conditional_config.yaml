# ============================================================
#  Radar View Generator — Conditional DCGAN Config
# ============================================================
data:
  dataset_path: "data/Dataset_19200_train_4800_test.npz"
  image_size:   [64, 64]
  original_size: [100, 160]
  channels:     1
  batch_size:   100
  num_classes:  4
  class_names:
    0: "Pedestrian"
    1: "Electric Scooter"
    2: "Car"
    3: "Background"

model:
  latent_dim:            100
  embed_dim:             50      # class embedding dimension
  generator_features:    128
  discriminator_features: 32

training:
  epochs:       30
  lr:           0.0002
  beta1:        0.5
  beta2:        0.999
  save_every:   5
  sample_every: 5
  num_samples:  25               # per-class sample grid size

paths:
  checkpoints:      "outputs/cdcgan/checkpoints"
  generated_images: "outputs/cdcgan/generated_images"
  logs:             "outputs/cdcgan/logs"
